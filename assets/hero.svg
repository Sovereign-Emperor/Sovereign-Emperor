<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Sovereign Emperor</title>
  <desc id="d">Banner for Sovereign Emperor: Computer Science student, software developer in progress, builder, entrepreneur, problem solver.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08080d"/><stop offset="1" stop-color="#150f26"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6d77a"/><stop offset="1" stop-color="#b8892b"/></linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.38"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.6"><stop offset="0" stop-color="#d4af37" stop-opacity="0.12"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8b6cff" stroke-opacity="0.10"/></pattern>
  </defs>
  <rect width="1000" height="310" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="310" rx="14" fill="url(#grid)"/>
  <rect width="1000" height="310" rx="14" fill="url(#glow)"/>
  <rect width="1000" height="310" rx="14" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="999" height="309" rx="14" fill="none" stroke="#d4af37" stroke-opacity="0.25"/>

  <!-- code motifs -->
  <text x="60" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="110" fill="#8b6cff" fill-opacity="0.09">&lt;/&gt;</text>
  <text x="800" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="110" fill="#d4af37" fill-opacity="0.08">{ }</text>

  <!-- corner brackets -->
  <g fill="none" stroke="#d4af37" stroke-opacity="0.7" stroke-width="2">
    <path d="M24 52V24H52"/><path d="M948 24H976V52"/><path d="M24 258V286H52"/><path d="M948 286H976V258"/>
  </g>

  <!-- crown -->
  <g>
    <path d="M472 84L476 54L490 68L500 46L510 68L524 54L528 84Z" fill="url(#gold)"/>
    <rect x="472" y="88" width="56" height="5" rx="2" fill="url(#gold)"/>
    <animate attributeName="opacity" values="1;0.8;1" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- title -->
  <text x="500" y="162" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="9" fill="#ffffff">SOVEREIGN <tspan fill="url(#gold)">EMPEROR</tspan></text>
  <rect x="440" y="182" width="120" height="2" fill="url(#gold)"/>

  <text x="500" y="214" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" letter-spacing="4" fill="#cfc9e6">COMPUTER SCIENCE STUDENT  ·  SOFTWARE DEVELOPER IN PROGRESS</text>
  <text x="500" y="240" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" letter-spacing="3" fill="#9a90c4">Builder  ·  Entrepreneur  ·  Problem Solver</text>
  <text x="500" y="272" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="18" fill="#d4af37">Learning deeply. Building relentlessly. Turning ideas into products.</text>
</svg>
